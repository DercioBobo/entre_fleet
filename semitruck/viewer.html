<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semi tractor viewer</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #efece6; }
  #truck-viewer { position: relative; width: 100%; height: 100vh; }
  three-d-stage { display: block; width: 100%; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  #truck-modes { position: absolute; top: 16px; left: 16px; display: flex; gap: 6px; z-index: 5; }
  #truck-modes button { font: 500 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em;
    padding: 8px 13px; border-radius: 999px; cursor: pointer; color: #3a3f46;
    background: rgba(255,255,255,.82); border: 1px solid rgba(0,0,0,.10); }
  #truck-modes button.on { background: #2b3138; border-color: #2b3138; color: #f4f2ee; }
  [data-style="blueprint"] #truck-modes button { background: rgba(255,255,255,.10); color: #cfe2f2; border-color: rgba(188,216,240,.35); }
  [data-style="blueprint"] #truck-modes button.on { background: #bcd8f0; color: #0d2744; border-color: #bcd8f0; }
</style>
</head>
<body>
<div id="truck-viewer">
  <three-d-stage name="semi-tractor" background="#efece6" autorotate></three-d-stage>
  <div id="truck-modes">
    <button data-mode="solid" class="on">Solid</button>
    <button data-mode="blueprint">Blueprint</button>
    <button data-mode="ghost">Line art</button>
  </div>
</div>
<script src="three-d-stage.js"></script>
<script type="module" src="semi_truck_model.js"></script>
<script>
  document.getElementById('truck-modes').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || !window.truck) return;
    window.truck.setStyle(b.dataset.mode);
    document.getElementById('truck-viewer').dataset.style = b.dataset.mode;
    for (const x of e.currentTarget.children) x.classList.toggle('on', x === b);
  });
</script>
</body>
</html>
